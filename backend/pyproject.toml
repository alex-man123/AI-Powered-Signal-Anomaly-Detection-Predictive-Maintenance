[project]
name = "backend"
version = "0.1.0"
description = "AI-Powered Vibration Signal Anomaly Detection & Predictive Maintenance — backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0.52",
    "torch>=2.14.0",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
